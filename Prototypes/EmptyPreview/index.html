<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mat Monkey · Empty states</title><link rel="stylesheet" href="../../styles.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--surface-sunken)}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent;-webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}.review{max-width:430px;margin:16px auto;display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:12px;padding:0 16px;color:var(--text-secondary)}.review select{min-width:0;flex:1;min-height:44px;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px;background:var(--surface-card);color:var(--text-primary)}.phone{width:390px;max-width:100%;height:844px;max-height:100svh;margin:0 auto;background:var(--bg-app);display:flex;flex-direction:column;position:relative;overflow:hidden}.safe-top{height:44px;flex-shrink:0}.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 10px 20px;flex-shrink:0}.wordmark,.header h1{font:800 32px/1 var(--font-display);letter-spacing:-.04em;margin:0}.wordmark span{color:var(--accent)}.icon{display:inline-block;flex-shrink:0;width:20px;height:20px;mask:var(--icon) center/contain no-repeat;background:currentColor}.icon-btn{width:44px;height:44px;display:inline-flex;justify-content:center;align-items:center;border-radius:50%}.icon-btn .icon{width:22px;height:22px}.segments{display:flex;padding:4px;border-radius:var(--radius-pill);background:var(--surface-sunken);margin:0 16px 6px;flex-shrink:0}.segments button{width:50%;height:38px;border-radius:var(--radius-pill);font:600 15px var(--font-display);color:var(--text-tertiary)}.segments button.active{background:var(--surface-card);color:var(--text-primary);font-weight:800;box-shadow:var(--shadow-card)}.body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding-bottom:24px}.body::-webkit-scrollbar{display:none}.empty{text-align:center;padding:24px}.empty-art{height:200px;display:flex;align-items:center;justify-content:center;animation:arrive var(--dur-slow) var(--ease-bounce)}.polaroid{width:200px;padding:8px;border-radius:var(--radius-lg);background:var(--surface-card);box-shadow:var(--shadow-card);transform:rotate(-6deg)}.photo-slot{height:120px;border-radius:var(--radius-md);background:var(--surface-sunken);display:grid;place-items:center;color:var(--text-tertiary)}.photo-slot .icon{width:36px;height:36px}.polaroid p{font:700 13px/1 var(--font-display);margin:12px 0 4px;color:var(--text-secondary)}.peek{position:relative;width:280px;display:flex;justify-content:center}.peek .polaroid{position:relative;z-index:1;animation:peekCard 5s var(--ease-bounce) infinite}.peek-monkey{position:absolute;top:-4px;right:0;width:64px;height:72px;transform-origin:0 100%;transform:rotate(16deg);animation:peekMonkey 5s var(--ease-bounce) infinite}.photo-slot{position:relative;overflow:hidden}.photo-slot .icon{animation:peekCam 5s var(--ease-bounce) infinite}.flash{position:absolute;inset:0;background:var(--surface-card);opacity:0;animation:peekFlash 5s var(--ease-out) infinite}@keyframes peekMonkey{0%,16%{transform:translate(-52px,28px) rotate(0)}28%,50%{transform:rotate(16deg)}56%{transform:rotate(6deg)}62%,70%{transform:rotate(16deg)}82%,100%{transform:translate(-52px,28px) rotate(0)}}@keyframes peekFlash{0%,38%{opacity:0}40%{opacity:.95}52%,100%{opacity:0}}@keyframes peekCam{0%,37%{transform:scale(1)}40%{transform:scale(.86)}50%,100%{transform:scale(1)}}@keyframes peekCard{0%,37%{transform:rotate(-6deg)}40%{transform:rotate(-7deg)}50%,100%{transform:rotate(-6deg)}}.empty h2{font:800 28px/1.05 var(--font-display);letter-spacing:-.03em;color:var(--text-primary);margin:16px 0 12px}.empty>.message{font:400 15px/1.45 var(--font-body);color:var(--text-secondary);margin:0;white-space:pre-line}.primary,.secondary{min-height:56px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;font:700 17px/1 var(--font-display);letter-spacing:-.01em}.primary{color:var(--text-on-accent);background:var(--accent);box-shadow:0 3px 0 var(--accent-shade)}.primary:active{translate:0 2px;box-shadow:0 1px 0 var(--accent-shade)}.empty>.primary{width:100%;margin-top:24px}.secondary{font-size:16px;min-height:48px;background:var(--surface-card);border:1px solid var(--border-default)}.ghost{min-height:48px;font:700 16px var(--font-display);display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;padding:0 12px}.ghost .icon{width:18px;height:18px}.ticket-art{width:256px;height:124px;display:flex;background:var(--surface-card);box-shadow:var(--shadow-card);border-radius:24px;position:relative;transform:rotate(5deg)}.ticket-stub{width:76px;flex-shrink:0;background:var(--surface-sunken);border-radius:24px 0 0 24px;display:grid;place-items:center;color:var(--text-tertiary)}.ticket-stub .icon{width:32px;height:32px}.ticket-art:before,.ticket-art:after{content:'';position:absolute;width:16px;height:16px;background:var(--bg-app);border-radius:50%;left:69px;z-index:1}.ticket-art:before{top:-8px}.ticket-art:after{bottom:-8px}.tear{height:100px;align-self:center;border-left:1.5px dashed var(--control-off)}.ticket-art p{font:800 20px/1.15 var(--font-display);letter-spacing:-.02em;color:var(--text-secondary);margin:auto 16px;text-align:left}.tabbar{height:86px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;background:var(--surface-card);border-top:1px solid var(--border-subtle);padding:0 6px}.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 0;color:var(--ink-400);font:600 11px/1 var(--font-display)}.tabbar button.active{color:var(--text-primary);font-weight:800}.tabbar button .icon{width:24px;height:24px}.tabbar .create{padding-top:8px}.create>span{width:56px;height:46px;display:grid;place-items:center;background:var(--accent);box-shadow:0 3px 0 var(--accent-shade);color:var(--white);border-radius:var(--radius-pill)}.create>span .icon{width:26px;height:26px}.session{margin:20px 16px 0;background:var(--surface-card);box-shadow:var(--shadow-card);border-radius:24px;display:flex;overflow:hidden;width:calc(100% - 32px);text-align:left}.date-stub{background:var(--accent-tint);color:var(--coral-700);padding:20px 10px;min-width:78px;text-align:center;border-right:2px dashed var(--control-off)}.date-stub small{font:800 13px var(--font-display)}.date-stub strong{display:block;font:800 36px/1 var(--font-display);margin:5px 0}.session-info{padding:20px 16px}.session-info h2{font:800 18px/1.15 var(--font-display);margin:0 0 8px}.session-info p{font-size:13px;color:var(--text-secondary);margin:0}.session-info small{font-size:12px;color:var(--text-tertiary);display:block;margin-top:12px}.feed-post{margin:24px 12px;background:var(--surface-card);border-radius:28px;padding:12px;box-shadow:var(--shadow-card)}.feed-post .byline{font-size:14px;margin:4px 2px 12px}.feed-post img{width:100%;height:280px;object-fit:cover;border-radius:20px}.feed-post h2{font:800 22px/1.15 var(--font-display);margin:16px 4px 8px;letter-spacing:-.015em}.feed-post p{font-size:15px;color:var(--text-secondary);margin:0 4px 12px}.feed-post small{display:block;font-size:12px;color:var(--text-tertiary);margin:12px 4px}.simple{padding:24px 20px}.simple h2{font:800 28px/1.05 var(--font-display);letter-spacing:-.03em}.simple p{font-size:15px;color:var(--text-secondary)}.person-row{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border-subtle);padding:20px 0}.avatar{width:44px;height:44px;border-radius:50%;background:var(--plum-100);color:var(--plum-700);display:grid;place-items:center;font:800 15px var(--font-display)}dialog{border:0;padding:24px;border-radius:var(--radius-xl);background:var(--bg-app);color:var(--text-primary);width:360px;max-width:calc(100% - 24px);max-height:90svh;overflow:auto;box-shadow:var(--shadow-float)}dialog::backdrop{background:var(--surface-overlay)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{font:800 22px/1.15 var(--font-display);letter-spacing:-.02em;margin:0}.field{display:block;font-size:13px;font-weight:600;margin:18px 0}.field input,.field select{display:block;width:100%;margin-top:8px;border:1.5px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-input);min-height:50px;padding:12px;color:var(--text-primary)}form>.primary{width:100%;margin-top:24px}.qr{display:block;width:180px;height:180px;margin:20px auto}.modal-copy{font-size:15px;color:var(--text-secondary);line-height:1.45}.subtle{font-size:13px;color:var(--text-tertiary);text-align:center}.modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}.review-note{max-width:430px;margin:16px auto 24px;text-align:center;font-size:12px;color:var(--text-tertiary)}@keyframes arrive{from{opacity:0;translate:0 10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:359px){.empty{padding-left:16px;padding-right:16px}.empty h2{font-size:26px}.primary{font-size:16px}.tabbar button{font-size:10px}}
</style></head><body><aside class="review"><label for="state">Review state</label><select id="state"><option value="fresh">First session</option><option value="planned">Plan made, no photo</option><option value="history">History, no plans</option></select></aside><div class="phone"><div class="safe-top"></div><header class="header" id="header"></header><div class="segments" id="segments" hidden></div><main class="body" id="body"></main><nav class="tabbar" id="nav" aria-label="Main navigation"></nav></div><p class="review-note">Design prototype · sample data stays in this page.</p><dialog id="modal"><div id="modal-content"></div></dialog><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>`<span class="icon" style="--icon:url('../../assets/icons/${n}.svg')" aria-hidden="true"></span>`;
let screen='activity',trainingTab='Upcoming',sessions=[],posts=[],friends=[];
const sample={id:'s1',title:'Saturday open mat',date:'2026-11-07',time:'10:00',gym:'Tidewater BJJ'};
function seed(mode){sessions=mode==='planned'?[{...sample}]:[];posts=mode==='history'?[{title:'Sunday open mat',date:'Sun, Nov 1',gym:'Tidewater BJJ'}]:[];friends=mode==='fresh'?[]:['Sarah Lee'];screen='activity';trainingTab='Upcoming';render()}
function artwork(kind){return `<div class="empty-art" aria-hidden="true">${kind==='plan'?`<div class="ticket-art"><span class="ticket-stub">${icon('calendar-plus')}</span><span class="tear"></span><p>Next up?<br>You decide.</p></div>`:`<div class="peek"><img class="peek-monkey" src="../../assets/brand/logo-mark.svg" alt=""><div class="polaroid"><div class="photo-slot">${icon('camera')}<span class="flash"></span></div><p>Post-roll, with your people.</p></div></div>`}</div>`}
function empty(kind,title,message,actionTitle,action,second='',secondAction='',actionIcon='plus',secondIcon='history'){return `<section class="empty">${artwork(kind)}<h2>${title}</h2><p class="message">${message}</p><button class="primary" data-action="${action}">${icon(actionIcon)}${actionTitle}</button>${second?`<button class="ghost" data-action="${secondAction}">${icon(secondIcon)}${second}</button>`:''}</section>`}
function feed(){return posts.map(p=>`<article class="feed-post"><div class="byline"><strong>Sarah</strong> trained with you & Alex</div><img src="${esc(p.photo||'../../assets/photos/group-class.jpg')}" alt="Friends training jiu-jitsu"><h2>${esc(p.title)}</h2><p>Good rounds with the usual crew.</p><small>${esc(p.date)} · ${esc(p.gym)}</small></article>`).join('')}
function sessionCard(s){return `<button class="session" data-action="session" data-id="${s.id}"><span class="date-stub"><small>${new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</small><strong>${new Date(s.date+'T12:00:00').getDate()}</strong>${new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{month:'short'})}</span><span class="session-info"><h2>${esc(s.title)}</h2><p>${esc(s.time)} · ${esc(s.gym)}</p><small>You host${friends.length?' · Sarah invited':''}</small></span></button>`}
function activity(){if(posts.length)return feed();if(sessions.length)return empty('memory','Your first photo<br>is on its way.','Train together, then share the post-roll photo.','View your plan','first-session','','','calendar');return empty('memory','Good memories<br>start on the mat.','Plan a session with your people.\nShare the photo after the rolls.','Plan a training session','plan',friends.length?'Already trained? Log it':'Add your mat people',friends.length?'log':'connect','plus',friends.length?'history':'qr-code')}
function training(){if(trainingTab==='Past'){if(posts.length)return feed();return empty('memory','Your mat memories<br>start here.','Already got some rounds in?\nLog the session and share a photo.','Log a past session','log','','','history')}if(sessions.length)return sessions.map(sessionCard).join('');return empty('plan','Summon<br>your crew','Pick a day. Bring your people.\nThe rounds will follow.','Plan a training session','plan','Already trained? Log it','log')}
function render(){const home=screen==='activity';$('#header').innerHTML=home?`<div class="wordmark" aria-label="Mat Monkey">mat monkey<span>.</span></div><button class="icon-btn" data-action="notifications" aria-label="Notifications">${icon('bell')}</button>`:`<h1>${screen==='training'?'Training':screen==='friends'?'Friends':'Profile'}</h1>`;$('#segments').hidden=screen!=='training';$('#segments').innerHTML=['Upcoming','Past'].map(t=>`<button data-action="training-tab" data-tab="${t}" class="${trainingTab===t?'active':''}" aria-pressed="${trainingTab===t}">${t}</button>`).join('');$('#body').innerHTML=home?activity():screen==='training'?training():screen==='friends'?`<section class="simple"><h2>${friends.length?'Your mat people.':'Bring your mat people.'}</h2>${friends.map(f=>`<div class="person-row"><span class="avatar">SL</span>${esc(f)}</div>`).join('')||'<p>Connect with a friend at your gym.</p>'}<button class="secondary" data-action="connect">${icon('qr-code')}Add a friend</button></section>`:`<section class="simple"><span class="avatar">DA</span><h2>Dani Alves</h2><p>Tidewater BJJ</p>${posts.length?feed():'<p>Your shared sessions will appear here after training.</p>'}</section>`;const tabs=[['activity','Activity','house'],['training','Training','calendar'],['friends','Friends','users'],['profile','Profile','user']];$('#nav').innerHTML=tabs.map(([id,label,i],n)=>`${n===2?`<button class="create" data-action="plan" aria-label="Plan a session"><span>${icon('plus')}</span></button>`:''}<button data-screen="${id}" class="${screen===id?'active':''}" ${screen===id?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('')}
function modal(title,body){$('#modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="Close">${icon('x')}</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal()}
function plan(past=false){modal(past?'Log a past session':'Plan a session',`<form id="plan-form" data-past="${past}"><label class="field">Session name<input name="title" required value="${past?'Sunday open mat':'Saturday open mat'}" maxlength="70"></label><label class="field">Date<input name="date" type="date" required value="${past?'2026-11-01':'2026-11-07'}"></label><label class="field">Time<input name="time" type="time" required value="10:00"></label><label class="field">Gym<input name="gym" required value="Tidewater BJJ" maxlength="90"></label>${friends.length?'<p class="modal-copy">Sarah will be invited.</p>':'<p class="modal-copy">You can invite friends with a link after planning.</p>'}<button class="primary" type="submit">${past?'Next: add a photo':'Create session'}${icon('chevron-right')}</button></form>`)}
function detail(s){modal(esc(s.title),`<p class="modal-copy">${esc(s.date)} · ${esc(s.time)}<br>${esc(s.gym)}</p><p class="modal-copy">${friends.length?'You & Sarah':'You’re organizing'}</p><p class="subtle">The shared photo comes after training.</p><button class="secondary" data-action="close" style="width:100%">Done</button>`)}
function complete(d){modal('Complete & share',`<form id="complete-form"><p class="modal-copy">Confirm the session happened and add a photo.</p><label class="field"><input style="display:inline;width:20px;min-height:20px" type="checkbox" name="completed" required> Training completed</label><label class="field">Training photo<input type="file" accept="image/*" name="photo" required></label><button class="primary" type="submit">Publish shared session</button></form>`);$('#complete-form').addEventListener('submit',e=>{e.preventDefault();posts.unshift({title:d.title,date:d.date,gym:d.gym,photo:URL.createObjectURL(new FormData(e.target).get('photo'))});$('#modal').close();screen='activity';render()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-screen]');if(!b)return;if(b.dataset.screen){screen=b.dataset.screen;render();$('#body').scrollTop=0;return}switch(b.dataset.action){case'close':$('#modal').close();break;case'plan':plan();break;case'log':plan(true);break;case'training-tab':trainingTab=b.dataset.tab;render();break;case'first-session':detail(sessions[0]);break;case'session':detail(sessions.find(s=>s.id===b.dataset.id));break;case'notifications':modal('All quiet for now.','<p class="modal-copy">Invitations and shared sessions will show up here.</p>');break;case'connect':modal('Add your mat people',`<img class="qr" src="friend-code.svg" alt="Demo friend QR code"><p class="modal-copy" style="text-align:center">Let a friend scan your code after class.</p><p class="subtle">Demo code · prototype only</p><button class="secondary" data-action="scan" style="width:100%">Try a demo scan</button>`);break;case'scan':if(!friends.includes('Sarah Lee'))friends.push('Sarah Lee');$('#modal').close();screen='friends';render();break}});
document.addEventListener('submit',e=>{if(e.target.id!=='plan-form')return;e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(e.target.dataset.past==='true'){complete(d);return}sessions.push({...d,id:'s'+Date.now()});$('#modal').close();screen='training';trainingTab='Upcoming';render()});$('#state').addEventListener('change',e=>seed(e.target.value));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});seed('fresh');
</script></body></html>
