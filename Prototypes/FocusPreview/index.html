const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icon=n=>`<span class="icon" style="--icon:url('../../assets/icons/${n}.svg')" aria-hidden="true"></span>`;
const node=(title='',children=[])=>({id:crypto.randomUUID(),title,children});const example=()=>[node('Guard passing',[node('Knee-cut entry',[node('Win the underhook')]),node('Settle into side control')]),node('Back escapes')];let items=[],saved=null,editing=false,view='plan',mode='plan',sessionName='',day='2026-11-07',time='10:00',gym='Tidewater BJJ',invited=[],showFocus=false,showNote=false,note='',privacy='friends',hasLink=false;
function rows(xs,depth=0){return xs.flatMap(x=>[{node:x,depth},...rows(x.children,depth+1)])}function find(id,xs=items){for(const x of xs){if(x.id===id)return x;const f=find(id,x.children);if(f)return f}return null}function remove(id,xs=items){const i=xs.findIndex(x=>x.id===id);if(i>=0){xs.splice(i,1);return true}return xs.some(x=>remove(id,x.children))}function valid(xs=items){return xs.every(x=>x.title.trim()&&valid(x.children))}function normalize(xs){return xs.map(x=>({...x,title:x.title.trim(),children:normalize(x.children)}))}
function editorNodes(xs,depth=0){return xs.map(x=>`<li data-node="${x.id}" ${depth===0?'class="focus-group"':''}><div class="focus-row ${depth===0?'root':''}" style="--depth:${depth}">${icon(depth===0?'notebook-pen':'chevron-right')}<div class="focus-main"><input class="focus-title" value="${esc(x.title)}" placeholder="${depth===0?'What would you like to work on?':'Break it down a little…'}" data-id="${x.id}" aria-label="${depth===0?'Training focus':'Detail, level '+(depth+1)}"><div class="row-actions"><button class="add-detail" data-action="child" data-id="${x.id}" aria-label="Add a detail to ${esc(x.title||'this focus')}">${icon('plus')}Add a detail</button><button class="icon-button remove" data-action="remove" data-id="${x.id}" aria-label="Remove ${esc(x.title||'focus')}">${icon('trash-2')}</button></div>${depth>=3?`<small class="level">Detail · level ${depth+1}</small>`:''}</div></div>${x.children.length?`<ul class="children" aria-label="Details for ${esc(x.title||'this focus')}">${editorNodes(x.children,depth+1)}</ul>`:''}</li>`).join('')}
function outline(xs,depth=0){return xs.map(x=>`<li><div class="outline-row ${depth===0?'root':''}" style="--depth:${depth}">${icon(depth===0?'notebook-pen':'chevron-right')}<span>${esc(x.title)}${depth>=3?`<small class="level">Detail · level ${depth+1}</small>`:''}</span></div>${x.children.length?`<ul>${outline(x.children,depth+1)}</ul>`:''}</li>`).join('')}
function editor(){return `<ul class="focus-root" aria-label="Training focus outline">${editorNodes(items)}</ul>${!items.length?`<div class="suggestions">${['Guard passing','Escapes','Sweeps'].map(t=>`<button class="tag" data-action="suggestion" data-title="${t}">${icon('plus')}${t}</button>`).join('')}</div>`:''}<button class="secondary add-root" data-action="root">${icon('plus')}Add a focus</button><p class="hint" id="focus-hint" ${valid()?'hidden':''}>Name each focus, or remove the blank one.</p>`}
function renderEditor(focusID){const scroll=$('#body').scrollTop;$('#editor').innerHTML=editor();updateValidity();if(focusID){const el=$(`[data-id="${focusID}"].focus-title`);el.focus();el.scrollIntoView({block:'nearest',behavior:'instant'})}else $('#body').scrollTop=scroll}
function updateValidity(){$('#save').disabled=!valid();if($('#focus-hint'))$('#focus-hint').hidden=valid()}
const futureDays=[['Today','2026-11-02',2],['Tue','2026-11-03',3],['Wed','2026-11-04',4],['Thu','2026-11-05',5],['Fri','2026-11-06',6],['Sat','2026-11-07',7],['Sun','2026-11-08',8]];
const pastDays=[['Yesterday','2026-11-01',1],['Sat','2026-10-31',31],['Fri','2026-10-30',30],['Thu','2026-10-29',29],['Wed','2026-10-28',28]];
const gyms=['Tidewater BJJ','North Shore Grappling','Harbor Jiu-Jitsu','Eastside MMA'];
const crew=[['Lena','Lena Park','LP',0],['Sarah','Sarah Lee','SL',8],['Kenji','Kenji Ito','KI',2],['Alex','Alex Moreno','AM',4]];
function clock(t){return new Date('2026-11-02T'+t+':00').toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function suggestedName(){const d=new Date(day+'T12:00:00').getDay();return d===6?'Saturday open mat':d===0?'Sunday open mat':Number(time.slice(0,2))<12?'Morning rolls':time.startsWith('12')?'Lunch rolls':'Evening rolls'}
function nativePlanFields(){return `<div class="segments"><button data-action="mode" data-value="plan" class="${mode==='plan'?'active':''}" aria-pressed="${mode==='plan'}">Upcoming</button><button data-action="mode" data-value="past" class="${mode==='past'?'active':''}" aria-pressed="${mode==='past'}">Already happened</button></div><input class="session-name" aria-label="Session name" value="${esc(sessionName)}" placeholder="${suggestedName()}"><p class="name-hint">Name it, or keep our suggestion.</p>
<section class="plan-field"><div class="section-heading"><h2>When</h2></div><div class="day-strip">${(mode==='past'?pastDays:futureDays).map(([label,value,n])=>`<button class="day-chip ${day===value?'active':''}" data-action="day" data-value="${value}" aria-label="${label}, ${value}" aria-pressed="${day===value}"><small>${label}</small><strong>${n}</strong></button>`).join('')}</div><div class="chip-wrap time-choices">${[...new Set([time,'06:30','12:15','18:00','19:30'])].map(t=>`<button class="choice ${time===t?'active':''}" data-action="time-choice" data-value="${t}" aria-pressed="${time===t}">${clock(t)}</button>`).join('')}<button class="choice" data-action="when">${icon('clock')}Other</button></div></section>
<section class="plan-field"><div class="section-heading"><h2>Where</h2></div><div class="chip-wrap">${[...new Set([...gyms,gym])].map(g=>`<button class="choice ${gym===g?'active':''}" data-action="gym-choice" data-value="${esc(g)}" aria-pressed="${gym===g}">${icon(g==='Tidewater BJJ'?'house':'map-pin')}${esc(g)}</button>`).join('')}</div><div class="inline-actions">${!showNote?`<button data-action="add-note">${icon('plus')}Add a note (optional)</button>`:''}${!showFocus?`<button data-action="open-focus" aria-expanded="false">${icon('plus')}Add a focus</button>`:''}</div>${showNote?`<textarea class="note-field" aria-label="Session note" placeholder="Gi or no-gi? Bring anything?">${esc(note)}</textarea>`:''}</section>`}
function nativeFriends(){return `<section class="invite"><div class="section-heading"><h2>${mode==='past'?'Who was there':'Invite friends'}</h2><small>${invited.length} picked</small></div><div class="friend-grid">${crew.map(([name,full,initials,streak])=>{const hue=[...full].reduce((s,c)=>s+c.codePointAt(0),0)%5;const tints=['sun','mint','sky','plum','coral'],inks=['sun-600','mint-700','sky-700','plum-700','coral-700'];const on=invited.includes(name);return `<button class="friend" data-action="invite" data-name="${name}" aria-label="${full}" aria-pressed="${on}"><span class="avatar" style="--avatar-tint:var(--${tints[hue]}-100);--avatar-ink:var(--${inks[hue]})">${initials}</span>${on?`<span class="picked">${icon('check')}</span>`:streak?`<span class="streak">${icon('flame')}${streak}</span>`:''}${name}</button>`}).join('')}</div></section>`}
function nativePrivacy(){return mode==='past'?'':`<section class="plan-field"><div class="section-heading"><h2>Who can join</h2></div><div class="segments join-choices">${[['friends','Friends only'],['link','Anyone with link']].map(([value,label])=>`<button data-action="privacy" data-value="${value}" class="${privacy===value?'active':''}" aria-pressed="${privacy===value}">${label}</button>`).join('')}</div><div class="link-box"><p>${hasLink?'<code>matmind.app/s/k3x9q</code>':privacy==='link'?'Anyone with a Mat Monkey account can join from the link.':'Only your friends can join from the link.'}</p><button class="secondary" data-action="${hasLink?'copy-link':'get-link'}">${icon(hasLink?'copy':'link')}${hasLink?'Copy':'Get link'}</button></div></section>`}
function refreshAtScroll(){const y=$('#body').scrollTop;render();$('#body').scrollTop=y}
function render(){const title=view==='plan'?(editing?'Edit focus plan':mode==='past'?'Log a past session':'Plan a session'):view==='detail'?'Session details':view==='post'?'Shared session':'Training';$('#header').innerHTML=`<button class="icon-button" data-action="close-view" aria-label="${view==='plan'?'Close':'Back'}">${icon(view==='plan'?'x':'chevron-left')}</button><h1>${title}</h1>`;
if(view==='plan'){$('#body').innerHTML=`${!editing?nativePlanFields():''}${showFocus||editing?`<section id="focus-section"><div class="section-heading"><h2>What are we working on?</h2><small>Optional</small></div><p class="section-copy">Big idea first. Details underneath.</p><div id="editor">${editor()}</div></section>`:''}${!editing?nativeFriends()+nativePrivacy():''}`;$('#footer').innerHTML=`<button class="primary" id="save" data-action="save">${icon(editing?'check':mode==='past'?'camera':'send')}${editing?'Save focus plan':mode==='past'?'Next: add a photo':invited.length?'Send invites to '+invited.length:'Create session'}</button>`;updateValidity()}
else if(view==='detail'||view==='post'){const post=view==='post';$('#body').innerHTML=`${post?'<img class="post-photo" src="../../assets/photos/group-class.jpg" alt="Jiu-jitsu training partners">':''}<h2 class="saved-title">${esc(saved.title)}</h2><p class="saved-meta">${esc(saved.date)} · ${esc(saved.time)}<br>${esc(saved.gym)}</p><div class="detail-heading"><h2>${post?'What we worked on':"What we're working on"}</h2>${!post?`<button class="icon-button" data-action="edit" aria-label="Edit session focus">${icon('pencil')}</button>`:''}</div>${saved.focus.length?`<ul class="outline">${outline(saved.focus)}</ul>`:'<p class="success">Leave room for a good surprise.</p>'}<h3 style="font:800 16px var(--font-display)">${post?'On the mat':"Who’s coming"}</h3><p class="saved-meta">You${saved.invited.length?' & '+saved.invited.map(esc).join(' & '):''}</p>${post?'<p class="success">One shared session, with the focus plan kept alongside it.</p>':''}`;$('#footer').innerHTML=post?'<button class="secondary" data-action="back-session">Back to the plan</button>':`<button class="primary" data-action="complete">${icon('camera')}Complete & share</button>`}
else{$('#body').innerHTML=`<div class="empty">${icon('calendar-plus')}<h2>Summon<br>your crew</h2><p>Pick a day. Bring your people.<br>The rounds will follow.</p><button class="primary" data-action="new">${icon('plus')}Plan a training session</button></div>`;$('#footer').innerHTML=''}$('#footer').hidden=view==='training';$('#body').scrollTop=0}
function modal(title,html){$('#modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div>${html}`;if(!$('#modal').open)$('#modal').showModal()}
function initialize(sample){$('#modal').close();items=sample?example():[];saved=null;editing=false;view='plan';mode='plan';invited=[];sessionName='';day='2026-11-07';time='10:00';gym='Tidewater BJJ';showFocus=sample;showNote=false;note='';privacy='friends';hasLink=false;render()}
document.addEventListener('input',e=>{if(e.target.matches('.focus-title')){find(e.target.dataset.id).title=e.target.value;const row=e.target.closest('.focus-row');row.querySelector('[data-action=child]').setAttribute('aria-label','Add a detail to '+(e.target.value||'this focus'));row.querySelector('[data-action=remove]').setAttribute('aria-label','Remove '+(e.target.value||'focus'));updateValidity()}else if(e.target.matches('.session-name'))sessionName=e.target.value;else if(e.target.matches('.note-field'))note=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'open-focus':{showFocus=true;const n=node();items=[n];render();renderEditor(n.id);break}case'add-note':showNote=true;refreshAtScroll();$('.note-field').focus();break;case'day':day=b.dataset.value;refreshAtScroll();break;case'time-choice':time=b.dataset.value;refreshAtScroll();break;case'gym-choice':gym=b.dataset.value;refreshAtScroll();break;case'privacy':privacy=b.dataset.value;refreshAtScroll();break;case'get-link':hasLink=true;refreshAtScroll();break;case'copy-link':{const copy=()=>{b.textContent='Copied'};navigator.clipboard?.writeText('https://matmind.app/s/k3x9q').then(copy).catch(()=>{b.textContent='Demo link'});break}case'root':{const n=node();items.push(n);renderEditor(n.id);break}case'suggestion':{const n=node(b.dataset.title);items.push(n);renderEditor(n.id);break}case'child':{const n=node();find(id).children.push(n);renderEditor(n.id);break}case'remove':{const x=find(id);if(x.children.length)modal('Remove this focus?','<p class="modal-copy">Its nested details will be removed too.</p><div class="modal-actions"><button class="secondary" data-action="close-modal">Keep it</button><button class="secondary danger" data-action="confirm-remove" data-id="'+id+'">Remove</button></div>');else{remove(id);renderEditor()}break}case'confirm-remove':remove(id);$('#modal').close();renderEditor();break;case'close-modal':$('#modal').close();break;case'invite':invited.includes(b.dataset.name)?invited=invited.filter(n=>n!==b.dataset.name):invited.push(b.dataset.name);refreshAtScroll();break;case'save':{if(!valid())return;const wasEditing=editing;if(editing){saved.focus=normalize(items);editing=false;view='detail'}else{saved={title:sessionName.trim()||suggestedName(),date:day,time,gym,note,privacy,focus:normalize(items),invited:[...invited]};view='detail'}render();if(mode==='past'&&!wasEditing)openCompletion();break}case'edit':items=structuredClone(saved.focus);showFocus=true;editing=true;view='plan';render();break;case'close-view':view=saved?'detail':'training';editing=false;render();break;case'new':initialize(false);break;case'mode':mode=b.dataset.value;day=mode==='past'?'2026-11-01':'2026-11-07';render();break;case'when':modal('When are we rolling?',`<form id="when-form"><label class="field">Date<input type="date" name="date" value="${day}" required></label><label class="field">Time<input type="time" name="time" value="${time}" required></label><button class="primary" type="submit">Save time</button></form>`);break;case'where':modal('Where are we rolling?',`<form id="where-form"><label class="field">Gym<input name="gym" value="${esc(gym)}" required maxlength="100"></label><button class="primary" type="submit">Save gym</button></form>`);break;case'complete':openCompletion();break;case'back-session':view='detail';render();break}});
function openCompletion(){modal('Complete & share',`<form id="complete-form"><p class="modal-copy">Keep the good rounds and the details you worked on.</p><label class="field"><input name="completed" type="checkbox" required style="display:inline;width:20px;min-height:20px">Training completed</label><p class="success">This browser demo uses the sample training photo.</p><button class="primary" type="submit">Publish shared session</button></form>`)}
document.addEventListener('submit',e=>{if(!e.target.matches('form'))return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(e.target.id==='when-form'){day=d.date;time=d.time;$('#modal').close();render()}if(e.target.id==='where-form'){gym=d.gym.trim();$('#modal').close();render()}if(e.target.id==='complete-form'){$('#modal').close();view='post';render()}});$('#example').onclick=()=>initialize(true);$('#blank').onclick=()=>initialize(false);initialize(new URLSearchParams(location.search).has('example'));
</script></body></html>
