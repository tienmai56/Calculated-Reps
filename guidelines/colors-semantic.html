<!-- @dsCard group="Colors" viewport="700x150" name="Status & flame" subtitle="Soft tints for badges; flame for streaks only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:4px}.n{font:700 12px/1.2 var(--font-body);color:var(--text-primary);margin-top:8px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success-500)"></div><div class="n">Success</div><div class="l">#1FB27E</div></div><div class="sw"><div class="chip" style="background:var(--success-tint)"></div><div class="n">tint</div><div class="l"></div></div><div class="sw"><div class="chip" style="background:var(--warning-500)"></div><div class="n">Warning</div><div class="l">#E0A100</div></div><div class="sw"><div class="chip" style="background:var(--warning-tint)"></div><div class="n">tint</div><div class="l"></div></div><div class="sw"><div class="chip" style="background:var(--danger-500)"></div><div class="n">Danger</div><div class="l">#E5383B</div></div><div class="sw"><div class="chip" style="background:var(--danger-tint)"></div><div class="n">tint</div><div class="l"></div></div><div class="sw"><div class="chip" style="background:var(--flame-500)"></div><div class="n">Flame</div><div class="l">#FF7A1A</div></div><div class="sw"><div class="chip" style="background:var(--flame-100)"></div><div class="n">tint</div><div class="l"></div></div></div></body></html>
