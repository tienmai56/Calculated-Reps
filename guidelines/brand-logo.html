<!-- @dsCard group="Brand" viewport="700x360" name="Logo — Silverback" subtitle="Mark, app icon and lockup from assets/brand" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app);font-family:var(--font-body);color:var(--text-primary)}*{box-sizing:border-box}.row{display:flex;gap:16px}.tile{flex:1;height:130px;border-radius:22px;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;gap:12px}.wm{font:800 30px/1 var(--font-display);letter-spacing:-.045em}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:6px}.cell{flex:1;min-width:0}</style></head><body>
<div class="row">
  <div class="cell"><div class="tile" style="background:var(--white)"><img src="../assets/brand/logo-mark.svg" alt="Silverback mark" width="92" height="104"></div><div class="l">logo-mark.svg · paper / white / sun</div></div>
  <div class="cell"><div class="tile" style="background:var(--accent)"><img src="../assets/brand/logo-mark-mono.svg" alt="Silverback mark, one color" width="92" height="104"></div><div class="l">logo-mark-mono.svg · on coral, 1-color print</div></div>
  <div class="cell"><div class="tile" style="background:var(--ink-900)"><img src="../assets/brand/app-icon.svg" alt="App icon" width="96" height="96" style="border-radius:22px"></div><div class="l">app-icon.svg · on ink and photos</div></div>
</div>
<div class="row" style="margin-top:22px">
  <div class="cell"><div class="tile" style="background:var(--white)"><img src="../assets/brand/logo-mark.svg" alt="" width="46" height="52"><span class="wm">mat monkeys<span style="color:var(--accent)">.</span></span></div><div class="l">lockup · mark height = 1.7× cap height</div></div>
  <div class="cell"><div class="tile" style="background:var(--ink-900);color:var(--paper)"><img src="../assets/brand/app-icon.svg" alt="" width="52" height="52" style="border-radius:12px"><span class="wm">mat monkeys<span style="color:var(--accent)">.</span></span></div><div class="l">reversed lockup · use the icon tile</div></div>
</div>
</body></html>
