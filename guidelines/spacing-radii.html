<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:4px}.n{font:700 12px/1.2 var(--font-body);color:var(--text-primary);margin-top:8px}</style></head><body><div style="display:flex;gap:14px"><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:6px;box-shadow:var(--shadow-card)"></div><div class="n">xs · 6</div><div class="l">tiny</div></div><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:10px;box-shadow:var(--shadow-card)"></div><div class="n">sm · 10</div><div class="l">thumbs</div></div><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-card)"></div><div class="n">md · 14</div><div class="l">inputs</div></div><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:22px;box-shadow:var(--shadow-card)"></div><div class="n">lg · 22</div><div class="l">cards</div></div><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:28px;box-shadow:var(--shadow-card)"></div><div class="n">xl · 28</div><div class="l">posts, sheets</div></div><div style="flex:1"><div style="height:72px;background:var(--white);border-radius:999px;box-shadow:var(--shadow-card)"></div><div class="n">pill · 999</div><div class="l">buttons, chips</div></div></div></body></html>
