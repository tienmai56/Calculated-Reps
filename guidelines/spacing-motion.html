<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="ease-out for UI · bounce for joins, likes, connects" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:4px}.n{font:700 12px/1.2 var(--font-body);color:var(--text-primary);margin-top:8px}</style></head><body><style>@keyframes mv{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(440px)}}.t{position:relative;height:30px;background:var(--white);border-radius:99px;margin-bottom:10px;box-shadow:var(--shadow-card)}.d{position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);animation:mv 2.4s infinite alternate}.lab{position:absolute;right:14px;top:8px;font:500 11px var(--font-mono);color:var(--ink-500)}</style><div class="t"><div class="d" style="animation-timing-function:var(--ease-out)"></div><span class="lab">ease-out · 220ms</span></div><div class="t"><div class="d" style="animation-timing-function:var(--ease-in-out)"></div><span class="lab">ease-in-out · 420ms</span></div><div class="t"><div class="d" style="animation-timing-function:var(--ease-bounce)"></div><span class="lab">bounce · 140–420ms</span></div></body></html>
