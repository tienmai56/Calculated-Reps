<!-- @dsCard group="Colors" viewport="700x150" name="Belt ranks" subtitle="Only when representing rank" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:4px}.n{font:700 12px/1.2 var(--font-body);color:var(--text-primary);margin-top:8px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--belt-white)"></div><div class="n">White</div><div class="l">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--belt-blue)"></div><div class="n">Blue</div><div class="l">#1F5BD6</div></div><div class="sw"><div class="chip" style="background:var(--belt-purple)"></div><div class="n">Purple</div><div class="l">#7A3FC4</div></div><div class="sw"><div class="chip" style="background:var(--belt-brown)"></div><div class="n">Brown</div><div class="l">#7A4E2D</div></div><div class="sw"><div class="chip" style="background:var(--belt-black)"></div><div class="n">Black</div><div class="l">#16140F</div></div><div class="sw"><div class="chip" style="background:var(--belt-grey)"></div><div class="n">Grey (kids)</div><div class="l">#9AA0A6</div></div><div class="sw"><div class="chip" style="background:var(--belt-yellow)"></div><div class="n">Yellow</div><div class="l">#F2C230</div></div><div class="sw"><div class="chip" style="background:var(--belt-orange)"></div><div class="n">Orange</div><div class="l">#F28C28</div></div><div class="sw"><div class="chip" style="background:var(--belt-green)"></div><div class="n">Green</div><div class="l">#2E9E4F</div></div></div></body></html>
