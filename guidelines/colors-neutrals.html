<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Warm canvas + ink ramp — never pure black or grey" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-app)}*{box-sizing:border-box}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-subtle)}.l{font:500 11px/1.3 var(--font-mono);color:var(--text-tertiary);margin-top:4px}.n{font:700 12px/1.2 var(--font-body);color:var(--text-primary);margin-top:8px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">White</div><div class="l">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="n">Paper · bg</div><div class="l">#FAF6EF</div></div><div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="n">Paper 2</div><div class="l">#F3ECE0</div></div><div class="sw"><div class="chip" style="background:var(--paper-3)"></div><div class="n">Paper 3</div><div class="l">#E9E0D1</div></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="n">Ink 200</div><div class="l">#DDD5C7</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="n">Ink 300</div><div class="l">#BDB5A7</div></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">Ink 500</div><div class="l">#756E62</div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">Ink 700</div><div class="l">#4A453D</div></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">Ink 900</div><div class="l">#1D1B18</div></div></div></body></html>
