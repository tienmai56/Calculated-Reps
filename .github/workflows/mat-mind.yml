name: Mat Monkey checks
on:
  pull_request:
  push:
    branches: [main, claude/great-pascal-iw1wg3]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  archive:
    name: Release archive
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Archive the production app for iOS
        run: >-
          xcodebuild -scheme IntentionalTrainingNotes
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MatMonkeys.xcarchive"
          CODE_SIGNING_ALLOWED=NO archive
      - name: Verify archived version metadata
        run: |
          xcodebuild -scheme IntentionalTrainingNotes -configuration Release -showBuildSettings -json CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/release-settings.json"
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          settings = next(row['buildSettings'] for row in json.loads((temp / 'release-settings.json').read_text()) if row['target'] == 'IntentionalTrainingNotes')
          with (temp / 'MatMonkeys.xcarchive/Products/Applications/IntentionalTrainingNotes.app/Info.plist').open('rb') as source:
              info = plistlib.load(source)
          for key, setting in [('CFBundleShortVersionString', 'MARKETING_VERSION'), ('CFBundleVersion', 'CURRENT_PROJECT_VERSION')]:
              assert info[key] == settings[setting], f'{key}: archived {info[key]!r}, expected {settings[setting]!r}'
          print(f"Verified archive version {info['CFBundleShortVersionString']} ({info['CFBundleVersion']})")
          PY
      - name: Verify Release excludes sample photos
        run: python3 scripts/check-release-assets.py "$RUNNER_TEMP/MatMonkeys.xcarchive/Products/Applications/IntentionalTrainingNotes.app"
      - name: Package the unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/MatMonkeys.xcarchive" "$RUNNER_TEMP/MatMonkeys-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MatMonkeys-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/MatMonkeys-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
  ios:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          candidates = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if 'iPhone' in d['name']]
          assert candidates, 'No iOS simulator is installed'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Build shared prototype UI
        run: xcodebuild -scheme MatMindPrototype -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO build
      - name: Build and test
        run: xcodebuild -scheme IntentionalTrainingNotes -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-password
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate migrations and authorization
        env:
          PGPASSWORD: local-test-password
        run: cat supabase/tests/bootstrap.sql supabase/migrations/*.sql supabase/tests/social.sql supabase/tests/qr.sql supabase/tests/persistent_friend_codes.sql supabase/tests/profile.sql supabase/tests/notifications.sql supabase/tests/comment_threads.sql supabase/tests/mentions.sql supabase/tests/usernames.sql supabase/tests/goal_sharing.sql supabase/tests/goal_updates.sql supabase/tests/session_edit.sql supabase/tests/follows.sql supabase/tests/invitation_previews.sql supabase/tests/session_link_rsvp.sql supabase/tests/upcoming_activity.sql supabase/tests/monkey.sql supabase/tests/session_photos.sql | psql -h localhost -U postgres -v ON_ERROR_STOP=1
      - name: Validate username search and following
        env:
          PGPASSWORD: local-test-password
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/username_search.sql
      - name: Verify simultaneous username allocation
        env:
          PGPASSWORD: local-test-password
        run: python3 scripts/test-username-concurrency.py
  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate account deletion and profile-photo cleanup
        run: node scripts/test-delete-account.mjs
      - name: Validate notification preferences and push routing
        run: node scripts/test-notification-worker.mjs
